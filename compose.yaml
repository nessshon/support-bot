services:
  bot:
    image: ghcr.io/nessshon/support-bot:2
    build: .
    container_name: support-bot
    restart: always
    env_file: .env
    depends_on:
      - redis
    # Your own texts: uncomment to use the locales folder instead of the texts in the image
    # volumes:
    #   - ./locales:/app/locales
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  redis:
    image: redis:alpine
    container_name: support-redis
    # A snapshot a minute after a change instead of up to an hour: less to lose if the server goes down
    command: redis-server --save 60 1
    restart: always
    volumes:
      - ./redis/data/:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
