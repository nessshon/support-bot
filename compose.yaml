services:
  bot:
    build:
      context: .
    container_name: support-bot
    restart: always
    depends_on:
      - redis
    volumes:
      - .:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  redis:
    image: redis:alpine
    container_name: support-redis
    # A snapshot a minute after a change instead of up to an hour: less to lose if the server goes down
    command: redis-server --save 60 1
    restart: always
    volumes:
      - ./redis/data/:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
